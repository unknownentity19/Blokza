<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Editor · Cilbs</title>
  <meta name="description" content="The Cilbs visual builder has moved to /app/." />
  <!-- The builder is a single-page app served from /app/. This page only exists
       so links and bookmarks pointing at the old URL keep working. -->
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://cilbs.dev/app/" />
  <meta http-equiv="refresh" content="0; url=app/index.html" />
  <link rel="icon" href="assets/images/favicon.svg?v=2" type="image/svg+xml" />
  <style>
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font: 15px/1.6 "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: #5b5470;
      background: #f8f9fb;
      text-align: center;
    }
    a { color: #6442d6; }
  </style>
  <script>
    // Replace rather than push, so Back does not bounce the user in a loop.
    location.replace('app/index.html');
  </script>
</head>
<body>
  <p>
    The editor now lives at <a href="app/index.html">/app/</a>.<br />
    Redirecting you there…
  </p>
</body>
</html>
