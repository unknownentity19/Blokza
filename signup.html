<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#ffffff" />
  <title>Create an account · BLOKZA</title>
  <meta name="description" content="Create a free BLOKZA account and start building. Your sites sync to every machine you use." />
  <!-- The editor asks for the password now, and it is the only place that does.
       This page exists so links and bookmarks pointing here keep working; a
       second copy of the form would be a second thing to keep in step, and the
       two drifted apart the last time there were two. -->
  <meta name="robots" content="noindex" />
  <link rel="canonical" href="https://blokza.com/app/" />
  <meta http-equiv="refresh" content="0; url=app/index.html?mode=signup" />
  <link rel="icon" href="assets/images/favicon.png?v=560ddc146c" type="image/png" />
  <style>
    body {
      margin: 0;
      display: grid;
      place-items: center;
      min-height: 100vh;
      font: 15px/1.6 "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      color: #5b5470;
      background: #f8f9fb;
      text-align: center;
    }
    a { color: #6442d6; }
  </style>
  <script>
    // Replace rather than push, so Back does not bounce the user in a loop.
    location.replace('app/index.html?mode=signup');
  </script>
</head>
<body>
  <p>
    Creating an account happens in <a href="app/index.html?mode=signup">the editor</a>.<br />
    Taking you there…
  </p>
</body>
</html>
