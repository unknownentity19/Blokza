<!doctype html>
<html lang="en">
<head>
<!-- @prod-pass v1 -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cilbs</title>
<meta name="description" content="Sign in to your Cilbs account." />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="assets/images/favicon.svg?v=2" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/base.css?v=18" />
<link rel="stylesheet" href="assets/css/pages.css?v=25" />
<link rel="canonical" href="https://cilbs.dev/signin.html" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://cilbs.dev/signin.html" />
<meta property="og:title" content="Sign In · Cilbs" />
<meta property="og:description" content="Sign in to your Cilbs account." />
<meta property="og:site_name" content="Cilbs" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Sign In · Cilbs" />
<meta name="twitter:description" content="Sign in to your Cilbs account." />
<link rel="manifest" href="/site.webmanifest" />
<link rel="dns-prefetch" href="https://fonts.googleapis.com" />
<style>
  .auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .auth-card {
    width: 100%;
    max-width: 420px;
    padding: 40px;
    background: white;
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(15, 15, 20, 0.08);
  }
  .auth-card h1 {
    font-size: 28px;
    margin-bottom: 12px;
    text-align: center;
  }
  .auth-card p {
    text-align: center;
    margin-bottom: 32px;
    font-size: 14px;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--fg);
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--p-500);
    box-shadow: 0 0 0 3px rgba(59, 98, 196, 0.1);
  }
  .btn-submit {
    width: 100%;
    padding: 12px 14px;
    background: var(--p-600);
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-submit:hover {
    background: var(--p-700);
  }
  .auth-footer {
    text-align: center;
    margin-top: 24px;
    font-size: 14px;
  }
  .auth-footer a {
    color: var(--p-600);
    text-decoration: none;
    font-weight: 600;
  }
  .auth-footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <header class="site-nav" style="border-bottom: 1px solid var(--border);"><div class="container site-nav__inner">
    <a class="site-nav__brand" href="index.html"><span class="brand-glyph" aria-hidden="true"><svg viewBox="0 0 24 24" width="26" height="26" fill="none"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4" stroke="currentColor" stroke-width="1.7"/><rect x="10.6" y="10.6" width="8.2" height="8.2" rx="2.2" fill="currentColor"/></svg></span><span class="brand-name">Cilbs</span></a>
  </div></header>

  <main id="main">
    <div class="auth-container">
      <div class="auth-card">
        <h1>Sign In</h1>
        <p>Welcome back to Cilbs</p>
        
        <form method="post">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <div class="auth-footer">
          <p style="margin: 0 0 12px;">Don't have an account? <a href="signup.html">Sign Up</a></p>
          <a href="#">Forgot password?</a>
        </div>
      </div>
    </div>
  </main>

  <script src="assets/js/site.js?v=8"></script>
</body>
</html>
