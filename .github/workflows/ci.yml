name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML parse check
        run: |
          python3 - <<'PY'
          import glob, sys
          from html.parser import HTMLParser
          class P(HTMLParser): pass
          ok = True
          for f in sorted(glob.glob('*.html')):
              try:
                  P().feed(open(f, encoding='utf-8').read())
                  print(f, 'ok')
              except Exception as e:
                  ok = False
                  print(f, 'FAIL', e)
          sys.exit(0 if ok else 1)
          PY
      - name: JS syntax check
        run: |
          for f in assets/js/*.js; do
            node -e "new Function(require('fs').readFileSync('$f','utf8'))" && echo "$f ok"
          done
      - name: Check for broken internal links
        run: |
          python3 - <<'PY'
          import re, glob, os, sys
          # Only site-relative hrefs are checkable. Absolute URLs (canonical tags,
          # og:url, outbound links) are not files in this repo, and treating them
          # as such is what used to make this job fail on every commit.
          ABSOLUTE = re.compile(r'^(?:[a-z][a-z0-9+.-]*:|//)', re.I)
          missing = []
          for f in sorted(glob.glob('*.html')):
              for m in re.finditer(r'href="([^"]+)"', open(f, encoding='utf-8').read()):
                  href = m.group(1).split('#')[0].split('?')[0]
                  if not href or ABSOLUTE.match(href) or not href.endswith('.html'):
                      continue
                  target = href.lstrip('/')
                  if not os.path.exists(target):
                      missing.append((f, href))
          if missing:
              for f, h in missing: print(f'{f} -> {h} MISSING')
              sys.exit(1)
          print('all internal links resolve')
          PY

  builder:
    name: Builder (typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: builder/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build:only
      - name: Verify the committed bundle is present
        # /app is committed because the static host has no build step. If the
        # build emits nothing, the deployed editor would silently be the old one.
        run: |
          test -f ../app/index.html
          test -d ../app/assets
          echo "app bundle built"
