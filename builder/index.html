<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f8f9fb" />
    <title>BLOKZA Builder</title>
    <meta name="description" content="BLOKZA visual builder — drag, drop and publish responsive websites." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="../assets/images/favicon.png?v=1" type="image/png" />
    <!--
      The editor's CSS has always named Inter, but nothing here ever loaded it —
      so the chrome rendered in whatever the OS supplied, and the sign-in wall
      could not look like the site the visitor just came from. `display=swap`
      keeps first paint immediate.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>The BLOKZA builder requires JavaScript.</noscript>

    <!--
      A blank page is the worst possible failure, so if the app has not mounted
      shortly after load, say something useful instead.

      The bundle is a classic script rather than an ES module precisely so that
      opening this file from disk works — browsers refuse module scripts from a
      `file://` origin. This guard is therefore no longer expected to fire from
      disk; if it does, the cause is genuinely unknown, and the message says so
      rather than guessing. It waits on the mount rather than sniffing the
      protocol, so it also catches a missing or mis-deployed `assets/` folder.
    -->
    <script>
      (function () {
        var root = document.getElementById('root');
        setTimeout(function () {
          if (!root || root.childElementCount > 0) return;
          var fromDisk = location.protocol === 'file:';
          root.innerHTML =
            '<div style="max-width:34rem;margin:16vh auto;padding:0 1.5rem;' +
            'font:15px/1.65 system-ui,-apple-system,sans-serif;color:#2a1f3d">' +
            '<h1 style="font-size:1.25rem;margin:0 0 .5rem">The editor could not start</h1>' +
            '<p style="margin:0 0 1rem;color:#5b5470">The bundle did not run. Check that' +
            ' the <code>assets</code> folder sits next to this file, and look in the' +
            ' browser console for the actual error.</p>' +
            (fromDisk
              ? '<p style="margin:0 0 .4rem;color:#5b5470">Opening from disk should work,' +
                ' but if your browser restricts local files, serving the folder always' +
                ' does:</p>' +
                '<pre style="margin:0 0 .75rem;padding:.75rem 1rem;background:#f1f3f8;' +
                'border:1px solid #e1e5ed;border-radius:6px;overflow:auto"><code>' +
                'python3 -m http.server 8000</code></pre>' +
                '<p style="margin:0;color:#5b5470">Then open' +
                ' <code>http://localhost:8000/app/index.html</code>.</p>'
              : '') +
            '</div>';
        }, 1500);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
