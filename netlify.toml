[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The builder bundle is content-hashed by Vite, so it is safe to cache forever.
[[headers]]
  for = "/app/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The app shell must always revalidate or a deploy leaves stale asset references.
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/index"
  to = "/"
  status = 301

[[redirects]]
  from = "/editor.html"
  to = "/app/"
  status = 301

[[redirects]]
  from = "/editor"
  to = "/app/"
  status = 301

# `publish = "."` serves the whole repository, which would expose the builder's
# TypeScript source and the superseded `legacy/` prototype as browsable files.
# Neither contains secrets, but neither belongs on the site either.
[[redirects]]
  from = "/builder/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/legacy/*"
  to = "/404.html"
  status = 404

# With a relative asset base, the shell must be reached at a URL that ends in a
# document. A bare `/app` would resolve `./assets/...` against `/`, so send it on.
[[redirects]]
  from = "/app"
  to = "/app/index.html"
  status = 301

[[redirects]]
  from = "/app/"
  to = "/app/index.html"
  status = 200
